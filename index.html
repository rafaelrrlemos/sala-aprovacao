<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sala de aprovação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#211E28;--surface:#2A2632;--surface2:#332E3D;--line:#3B3546;
  --ink:#F6F1E8;--dim:#B9B2C4;--mute:#9C93AE;--brand:#6B5B95;--brandsoft:#C6B7E0;
  --ok:#7FA98A;--okink:#0F1A13;--warn:#E0B15F;--warnink:#241A07;--pend:#403A4C;--pendink:#C6BFD1;
}
html,body{background:var(--bg);color:var(--ink);
  font-family:'Instrument Sans',system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:Georgia,'Times New Roman',serif}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
img{display:block;max-width:100%}
a{color:var(--brandsoft)}
.esconde{display:none!important}

/* ---------------------------------------------------------------- estrutura */
.sala{display:flex;min-height:100vh;align-items:stretch}
.lado{width:260px;flex:none;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:22px 16px;gap:20px;position:sticky;top:0;height:100vh}
.corpo{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:0}
.topo{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  padding:26px 32px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.topo h1{font-family:Georgia,serif;font-size:26px;line-height:1.15;font-weight:400}
.topo .sub{font-size:12.5px;color:var(--mute);margin-top:6px}
.tabs{display:none}

/* perfil e progresso */
.perfil{display:flex;align-items:center;gap:12px;padding:0 4px}
.av{width:44px;height:44px;border-radius:999px;flex:none;background:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-family:Georgia,serif}
.caixa{padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:11px}
.barra{height:5px;border-radius:999px;background:var(--surface2);overflow:hidden}
.barra i{display:block;height:100%;background:var(--brandsoft);border-radius:999px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;
  border-radius:10px;color:var(--mute);font-size:14px;font-weight:500;width:100%}
.nav button.on{background:var(--surface2);color:var(--ink);font-weight:600}

/* selos */
.selo{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;
  font-size:11px;font-weight:600;white-space:nowrap}
.selo.aprovado{background:var(--ok);color:var(--okink)}
.selo.alteracao{background:var(--warn);color:var(--warnink)}
.selo.pendente{background:var(--pend);color:var(--pendink)}
.selinho{width:20px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.selinho.aprovado{background:var(--ok);color:var(--okink)}
.selinho.alteracao{background:var(--warn);color:var(--warnink)}
.selinho.pendente{background:var(--pend);color:var(--pendink)}

/* controlos */
.filtros{display:flex;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
.filtros button{display:flex;align-items:center;gap:7px;min-height:36px;padding:0 13px;
  border-radius:999px;font-size:12.5px;color:var(--dim);white-space:nowrap;flex:none}
.filtros button.on{background:var(--surface2);color:var(--ink);font-weight:600}
.ponto{width:6px;height:6px;border-radius:999px}
.vistas{display:flex;gap:2px;border:1px solid var(--line);border-radius:11px;padding:2px}
.vistas button{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;color:var(--mute)}
.vistas button.on{background:var(--surface2);color:var(--ink)}

/* grelha */
.grelha{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding:24px 32px 40px}
.cel{display:flex;flex-direction:column;gap:6px;width:100%;align-items:stretch}
.arte{display:block;position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;background:var(--surface2);
  border:1px solid var(--line)}
.arte img{width:100%;height:100%;object-fit:cover}
.arte.story{aspect-ratio:9/16}
.arte .badge{position:absolute;top:6px;left:6px}
.vazia{width:100%;height:100%;display:flex!important;align-items:center;justify-content:center;text-align:center;
  padding:10px;color:var(--mute);
  background:repeating-linear-gradient(135deg,var(--surface2) 0 8px,var(--surface) 8px 16px)}
.cap{display:block;font-size:11px;color:var(--mute);line-height:1.4}
.cap b{color:var(--dim);font-weight:600}

/* lista */
.linha{display:grid;grid-template-columns:52px 104px 108px 1fr 260px 150px;gap:16px;align-items:center;
  padding:12px 32px;border-top:1px solid var(--line);width:100%}
.linha .mini{display:block;width:52px;height:65px;overflow:hidden;background:var(--surface2)}
.linha .mini img{width:100%;height:100%;object-fit:cover}
.cabl{display:grid;grid-template-columns:52px 104px 108px 1fr 260px 150px;gap:16px;
  padding:0 32px 10px;align-items:end;color:var(--mute)}

/* peca aberta */
.peca{flex:1;display:flex;align-items:stretch;min-height:0}
.centro{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
  padding:28px 32px 40px;gap:18px}
.slide{width:100%;max-width:420px;aspect-ratio:4/5;overflow:hidden;background:var(--surface2);
  box-shadow:0 20px 44px rgba(0,0,0,.38)}
.slide.story{aspect-ratio:9/16;max-width:300px}
.slide img{width:100%;height:100%;object-fit:cover}
/* passar lâmina: uma seta de cada lado, FORA da arte — nunca por cima do texto.
   No computador vivem nas margens; no telemóvel não há margem, descem para baixo. */
.palco{position:relative;width:100%;max-width:532px;display:flex;justify-content:center;
  padding:0 56px;touch-action:pan-y}
.palco.story{max-width:412px}
.seta{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;
  border-radius:999px;background:rgba(26,23,32,.72);border:1px solid rgba(246,241,232,.18);
  color:var(--ink);display:flex;align-items:center;justify-content:center;z-index:3;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .15s}
.seta:hover{background:rgba(26,23,32,.92)}
.seta.esq{left:0}
.seta.dir{right:0}
.seta:disabled{opacity:.28;cursor:default}
.conta-lam{font-size:11.5px;color:var(--mute);line-height:1.55;text-align:center}
.tira{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tira button{display:block;width:74px;flex:none;position:relative;line-height:0}
.tira .t{display:block;position:relative;width:74px;height:93px;overflow:hidden;
  background:var(--surface2);border:1px solid var(--line)}
.tira .t.story{height:132px}
.tira button.on .t{outline:2px solid var(--brandsoft);outline-offset:2px}
.tira img{width:100%;height:100%;object-fit:cover}
.tira .n{position:absolute;bottom:4px;left:4px;padding:1px 6px;border-radius:999px;
  background:rgba(20,18,26,.78);color:#F6F1E8;font-size:9px;font-weight:700}
.painel{width:100%;max-width:560px;padding:20px 22px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line)}
.legenda{font-size:13.5px;line-height:1.75;color:var(--dim);white-space:pre-line}
.rail{width:340px;flex:none;background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column}
.rail section{padding:18px 20px;border-bottom:1px solid var(--line)}
.rail section:last-child{border-bottom:none}
.ficha div{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:5px 0}
.ficha span:first-child{color:var(--mute)}
.ficha span:last-child{color:var(--dim);text-align:right}
.decisao{display:flex;flex-direction:column;gap:9px}
.decisao button{display:flex;align-items:center;justify-content:space-between;min-height:48px;
  padding:0 16px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;
  color:var(--mute);font-weight:500;width:100%}
.decisao button.aprovado.on{background:var(--ok);color:var(--okink);border-color:var(--ok);font-weight:600}
.decisao button.alteracao.on{background:var(--warn);color:var(--warnink);border-color:var(--warn);font-weight:600}
.decisao button.pendente.on{background:var(--pend);color:var(--pendink);border-color:var(--pend);font-weight:600}
.conversa{display:flex;flex-direction:column;gap:16px;flex:1}
.com{display:flex;gap:10px}
.com .a{width:30px;height:30px;border-radius:999px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-family:Georgia,serif;background:var(--brand)}
.com.agencia .a{background:var(--surface2);color:var(--dim)}
.com .quem{font-size:11px;color:var(--mute);margin-bottom:4px}
.com .quem b{color:var(--dim);font-weight:600}
.com .t{font-size:13px;line-height:1.6;background:var(--surface2);border-radius:10px;padding:10px 12px}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);
  padding:11px 12px;min-height:88px;font:inherit;font-size:13px;line-height:1.6;resize:vertical}
textarea::placeholder{color:var(--mute)}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:10px;
  font-size:13px;font-weight:600;width:100%}
.bt.forte{background:var(--brandsoft);color:#231F2C}
.bt.ok{background:var(--ok);color:var(--okink)}
.bt.linha{border:1px solid var(--line);color:var(--ink)}
a.bt{text-decoration:none}
.aviso{padding:12px 14px;border-radius:10px;background:var(--surface2);font-size:11.5px;
  line-height:1.55;color:var(--dim);display:flex;gap:10px}
.nota{font-size:11.5px;color:var(--mute);line-height:1.55}

/* stories e reels */
.dias{display:flex;gap:10px;padding:18px 32px 6px;flex-wrap:wrap}
.dia{display:flex;flex-direction:column;align-items:center;gap:7px;width:86px}
.anel{display:block;width:72px;height:72px;border-radius:999px;padding:3px;
  border:2px solid var(--line);overflow:hidden}
.anel.montado{border-color:var(--brandsoft)}
.anel.aprovado{border-color:var(--ok)}
.anel img{width:100%;height:100%;object-fit:cover;border-radius:999px}
.anel .vazia{border-radius:999px}
.placas{display:flex;flex-wrap:wrap;gap:12px;padding:22px 32px 8px}
.placa{width:96px;flex:none;display:flex;flex-direction:column;gap:6px;position:relative}
.placa .p{width:96px;height:171px;overflow:hidden;position:relative;border-radius:7px;background:var(--surface2)}
.placa img{width:100%;height:100%;object-fit:cover}
.placa .num{position:absolute;top:6px;left:6px;padding:2px 7px;border-radius:999px;
  background:rgba(20,18,26,.78);color:#F6F1E8;font-size:10px;font-weight:700}
.placa .video{position:absolute;inset:0;background:rgba(33,30,40,.6);display:flex;
  align-items:center;justify-content:center;color:var(--warn)}
.cartoes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:22px 32px 34px}

/* semanas (a entrada da sala) */
.semanas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:24px 32px 40px;max-width:900px}
.semana{display:flex;flex-direction:column;gap:12px;padding:20px 22px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);width:100%;text-align:left;
  transition:border-color .15s}
.semana:hover{border-color:var(--brandsoft)}
.semana h3{font-family:Georgia,serif;font-size:20px;line-height:1.25;font-weight:400}
.semana .contas{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.semana .contas span{display:flex;align-items:center;gap:6px}

/* estrategia */
.est{display:flex;flex-direction:column;gap:12px;padding:22px 32px 40px;max-width:780px}
.est .bloco{padding:16px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.est .andar{border-left:3px solid var(--line)}
.est .andar.on{border-left-color:var(--brandsoft)}
.est h3{font-family:Georgia,serif;font-size:19px;font-weight:400;margin:6px 0 5px}
.est .ritmo{display:flex;gap:12px;align-items:baseline;padding:4px 0}
.est .ritmo b{width:56px;flex:none;font-family:Georgia,serif;font-size:14px;
  color:var(--brandsoft);font-weight:400}
.est .regra{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:12.5px;
  line-height:1.5;color:var(--dim)}

/* fim */
.fim{max-width:520px;margin:0 auto;padding:32px;display:flex;flex-direction:column;
  align-items:center;text-align:center;gap:14px}
.fim .circ{width:56px;height:56px;border-radius:999px;background:var(--ok);color:var(--okink);
  display:flex;align-items:center;justify-content:center}

/* estados de carga */
.carga{padding:60px 32px;text-align:center;color:var(--mute);font-size:13px}
.aviso-erro{margin:16px 32px;padding:14px 16px;border-radius:10px;background:#3A2226;
  color:#F2D6D6;font-size:13px;line-height:1.6}

/* --------------------------------------------------------------- telemovel */
@media (max-width:899px){
  .sala{display:block;min-height:100vh;padding-bottom:78px}
  .semanas{grid-template-columns:1fr;gap:12px;padding:14px}
  .lado{width:auto;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);
    padding:16px 14px;gap:14px}
  .lado .nav{display:none}
  .lado .rodape{display:none}
  .topo{padding:16px 14px 12px;align-items:flex-start;flex-direction:column;gap:12px}
  .topo h1{font-size:20px}
  .topo .accoes{width:100%;display:flex;gap:8px;justify-content:space-between;align-items:center}
  .filtros{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .filtros::-webkit-scrollbar{display:none}
  .topo .accoes{flex-wrap:nowrap}
  .grelha{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 14px 24px}
  .cartoes{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px}
  .linha,.cabl{grid-template-columns:52px 1fr 92px;gap:12px;padding-left:14px;padding-right:14px}
  .linha .col-formato,.cabl .col-formato,.linha .col-legenda,.cabl .col-legenda{display:none}
  .peca{flex-direction:column}
  .centro{padding:16px 14px 20px}
  /* sem margem lateral no telemóvel: as setas passam para baixo da arte */
  .palco{max-width:420px;padding:0;flex-wrap:wrap;gap:14px;align-items:center}
  .palco.story{max-width:300px}
  .palco>.slide{flex:0 0 100%}
  .seta{position:static;transform:none}
  .rail{width:auto;border-left:none;border-top:1px solid var(--line)}
  .dias,.placas,.est{padding-left:14px;padding-right:14px}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);
    border-top:1px solid var(--line);padding:4px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;min-height:56px;color:var(--mute);font-size:10px;font-weight:500}
  .tabs button.on{color:var(--ink);font-weight:600}
  .tabs .risco{display:block;width:20px;height:2px;border-radius:2px;background:transparent}
  .tabs button.on .risco{background:var(--brandsoft)}
}

/* ---------------------------------------------------------------- impressao */
.imp{display:none}
body.so-imp .imp{display:block;background:#fff;color:#111;min-height:100vh;padding:28px}
body.so-imp .sala,body.so-imp .tabs{display:none!important}
.imp .pagina{page-break-after:always;break-after:page;padding-bottom:24px}
.imp .pagina:last-child{page-break-after:auto}
.imp .cab{border-bottom:2px solid #111;padding-bottom:10px;margin-bottom:6px}
.imp .cab .linha1{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#666;margin-bottom:6px}
.imp .cab h2{font-family:Georgia,serif;font-size:22px;font-weight:400;color:#111}
.imp .fila{display:flex;gap:20px;align-items:flex-start;padding:14px 0;border-bottom:1px solid #ddd;
  page-break-inside:avoid;break-inside:avoid}
.imp .fila .col-arte{width:200px;flex:none}
.imp .fila img{width:100%;border:1px solid #ccc;display:block}
.imp .fila .semarte{width:100%;aspect-ratio:4/5;border:1px dashed #bbb;display:flex;
  align-items:center;justify-content:center;font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:#999;text-align:center;padding:8px}
.imp .fila .semarte.story{aspect-ratio:9/16}
.imp .fila .col-copy{flex:1;min-width:0}
.imp .fila .rot{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#888;margin:6px 0 0}
.imp .fila .gravar{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8a6d1a;margin-bottom:6px}
.imp .fila .guiao-imp{font-family:Georgia,serif;font-size:13.5px;line-height:1.75;color:#222;white-space:pre-line}
.imp .leg{padding:16px 0 0}
.imp .leg .rot{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#888;margin-bottom:8px}
.imp .leg .texto{font-size:12px;line-height:1.8;color:#222;white-space:pre-line;max-width:640px}
@media print{
  body{background:#fff;color:#111}
  .lado,.tabs,.topo .accoes,.naoimprime{display:none!important}
  .sala{display:block;padding:0}
  body.so-imp .sala{display:none!important}
  .imp{display:none}
  body.so-imp .imp{display:block;padding:0 0 24px}
}
</style>
</head>

function selo(e){ return '<span class="selo ' + e + '">' + svg(ICONE[e],13,2.2) + ROTULO[e] + '</span>'; }
function selinho(e){ return '<span class="selinho ' + e + '">' + svg(ICONE[e],12,2.4) + '</span>'; }

function quando(iso, comHora){
  var d = new Date(iso);
  var o = { timeZone:"America/Sao_Paulo", day:"2-digit", month:"2-digit" };
  var s = d.toLocaleDateString("pt-BR", o);
  if (comHora){
    var h = d.toLocaleTimeString("pt-BR", { timeZone:"America/Sao_Paulo", hour:"2-digit", minute:"2-digit" });
    s += " · " + (h.replace(":00","h").replace(":","h"));
  }
  return s;
}
function hora(iso){
  var h = new Date(iso).toLocaleTimeString("pt-BR",
    { timeZone:"America/Sao_Paulo", hour:"2-digit", minute:"2-digit" });
  return h.replace(":00","h").replace(":","h");
}
function tipoRotulo(p){
  if (p.tipo === "carrossel") return "Carrossel · " + p.laminas.length;
  if (p.tipo === "stories") return "Stories · " + p.laminas.length;
  if (p.tipo === "reel") return "Reel";
  return "Post";
}
function pecaPorChave(c){
  for (var i=0;i<D.pecas.length;i++) if (D.pecas[i].chave === c) return D.pecas[i];
  return null;
}
function semanaAtual(){
  for (var i=0;i<D.semanas.length;i++) if (D.semanas[i].inicio === semanaSel) return D.semanas[i];
  return null;
}
function diaMes(iso){ var p = iso.split("-"); return p[2] + "/" + p[1]; }
function faixaSemana(s){ return diaMes(s.inicio) + " – " + diaMes(s.fim); }
function rotuloSemana(s){ return s.titulo || ("Semana de " + faixaSemana(s)); }
function daSemana(){
  if (!semanaSel) return D.pecas;
  return D.pecas.filter(function(p){ return p.semana === semanaSel; });
}
function diaSP(iso){
  return new Date(iso).toLocaleDateString("pt-BR", { timeZone:"America/Sao_Paulo" });
}
// n.º de publicação dentro do dia: a peça 1 é a primeira a sair
function numeroDa(p){
  var dia = diaSP(p.publicar_em);
  var doDia = D.pecas.filter(function(x){ return diaSP(x.publicar_em) === dia; })
    .sort(function(a,b){ return a.publicar_em < b.publicar_em ? -1 : 1; });
  for (var i=0;i<doDia.length;i++) if (doDia[i].chave === p.chave) return i+1;
  return 1;
}
var MESES_C = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function diaCurto(iso){
  var d = new Date(new Date(iso).getTime() - 3*3600*1000);
  return ("0" + d.getUTCDate()).slice(-2) + MESES_C[d.getUTCMonth()];
}
function doFeed(){ return daSemana().filter(function(p){ return p.tipo === "post" || p.tipo === "carrossel"; }); }
function dosReels(){ return daSemana().filter(function(p){ return p.tipo === "reel"; }); }
function dosStories(){ return daSemana().filter(function(p){ return p.tipo === "stories"; }); }

function arte(lam, classe){
  var c = "arte " + (classe || "");
  if (lam && lam.asset){
    return '<div class="' + c + '"><img loading="lazy" src="' + IMG + encodeURI(lam.asset) +
           '" alt=""></div>';
  }
  var txt = lam && lam.producao === "por_gravar" ? "por<br>gravar" : "por<br>desenhar";
  return '<div class="' + c + '"><div class="vazia"><span class="eyebrow" style="line-height:1.6">' +
         txt + '</span></div></div>';
}

// ------------------------------------------------------------------- rede
function puxar(){
  return fetch(API).then(function(r){
    if (!r.ok) throw new Error("nao consegui abrir a sala");
    return r.json();
  }).then(function(j){ D = j; erroMsg = ""; desenhar(); });
}

function enviar(chave, accao, corpo){
  if (!nome){
    var n = prompt("Como se chama? (fica guardado neste telemóvel)");
    if (!n) return Promise.resolve();
    nome = n.trim().slice(0,80);
    localStorage.setItem("sala_nome_" + SLUG, nome);
  }
  corpo.autor = nome;
  corpo.autor_tipo = eu;
  ocupado = true; desenhar();
  return fetch(API + "/p/" + encodeURIComponent(chave) + "/" + accao, {
    method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(corpo)
  }).then(function(r){
    if (!r.ok) return r.json().then(function(j){ throw new Error(j.erro || "falhou"); });
    return r.json();
  }).then(function(j){ D = j; erroMsg = ""; })
    .catch(function(e){ erroMsg = "Não consegui guardar: " + e.message + ". Tente outra vez."; })
    .then(function(){ ocupado = false; desenhar(); });
}

// ------------------------------------------------------------- estrategia
// A estratégia mostrada é SEMPRE a da semana aberta. A estratégia do mês
// inteiro é conversada na call mensal e não passa por aqui.
function estrategiaHTML(){
  var s = semanaAtual();
  var e = (s && s.estrategia) || {};
  var partes = [];
  if (e.foco) partes.push('<div class="bloco andar on">' +
    '<div class="eyebrow" style="color:var(--mute)">O foco da semana</div>' +
    '<h3>' + esc(s.titulo || "Esta semana") + '</h3>' +
    '<div style="font-size:13px;color:var(--dim);line-height:1.65">' + esc(e.foco) + '</div></div>');
  if (e.pilares) partes.push('<div class="bloco"><div class="eyebrow" style="color:var(--mute);' +
    'margin-bottom:11px">Os pilares desta semana</div>' +
    e.pilares.map(function(p){ return '<div style="display:flex;gap:11px;align-items:baseline;padding:4px 0">' +
      '<span class="serif" style="width:26px;flex:none;font-size:15px;color:var(--brand)">' + esc(p[0]) + '</span>' +
      '<span style="flex:1;font-size:12.5px;line-height:1.45">' + esc(p[1]) + '</span></div>'; }).join("") + '</div>');
  if (e.ritmo) partes.push('<div class="bloco"><div class="eyebrow" style="color:var(--mute);' +
    'margin-bottom:11px">O ritmo da semana · hora do Brasil</div>' +
    e.ritmo.map(function(r){ return '<div class="ritmo"><b>' + esc(r[0]) + '</b>' +
      '<span style="font-size:12.5px;color:var(--dim);line-height:1.5">' + esc(r[1]) + '</span></div>'; }).join("") +
    '</div>');
  if (e.regras) partes.push('<div class="bloco"><div class="eyebrow" style="color:var(--mute);' +
    'margin-bottom:11px">As regras que atravessam tudo</div>' +
    e.regras.map(function(r){ return '<div class="regra"><span style="color:var(--brandsoft)">' +
      svg(I.ok,14,2.2) + '</span><span>' + esc(r) + '</span></div>'; }).join("") + '</div>');
  // a ordem de publicação: o nº que acompanha a peça no site e no nome do
  // ficheiro baixado — o nº 1 é o primeiro a sair (e o último a aparecer na
  // grelha, porque a grelha mostra sempre o mais novo primeiro)
  var ordenadas = daSemana().slice().sort(function(a,b){ return a.publicar_em < b.publicar_em ? -1 : 1; });
  if (ordenadas.length){
    var porDia = {};
    ordenadas.forEach(function(p){ var d = quando(p.publicar_em); (porDia[d] = porDia[d] || []).push(p); });
    var linhasOrd = Object.keys(porDia).map(function(d){
      return '<div style="padding:6px 0">' +
        '<div class="eyebrow" style="color:var(--brandsoft);margin-bottom:4px">' + esc(d) + '</div>' +
        porDia[d].map(function(p){
          return '<div style="display:flex;gap:10px;align-items:baseline;padding:3px 0;font-size:12.5px">' +
            '<span class="serif" style="width:26px;flex:none;color:var(--brand)">' + numeroDa(p) + 'º</span>' +
            '<span style="width:46px;flex:none;color:var(--mute)">' + hora(p.publicar_em) + '</span>' +
            '<span style="flex:1;line-height:1.45;color:var(--dim)">' + esc(tipoRotulo(p).split(" · ")[0]) +
              ' — ' + esc(p.titulo) + '</span></div>';
        }).join("") + '</div>';
    }).join("");
    partes.push('<div class="bloco"><div class="eyebrow" style="color:var(--mute);margin-bottom:5px">' +
      'A ordem de publicação</div>' +
      '<div style="font-size:11px;color:var(--mute);line-height:1.5;margin-bottom:8px">' +
      'O nº acompanha a peça no site e no nome do ficheiro baixado. O nº 1 sai primeiro — ' +
      'e por isso fica por baixo na grelha, que mostra sempre o mais novo à frente.</div>' +
      linhasOrd + '</div>');
  }
  if (e.nota) partes.push('<div class="aviso">' + svg(I.relogio,16) + '<div>' + esc(e.nota) + '</div></div>');
  if (!partes.length) partes.push('<div class="carga">A estratégia desta semana ainda não foi escrita.</div>');
  return topoHTML("A estratégia da semana",
      esc((s ? faixaSemana(s) : "") + " · o porquê de cada peça"), "") +
    '<div class="est">' + partes.join("") + '</div>';
}

// O PDF: uma peça (um "conjunto") por página, no mínimo. Duas colunas por
// lâmina — a arte à esquerda; à direita SÓ a copy do que a Teneci grava
// (producao = por_gravar). No fim da peça, o texto da legenda.
function impPecaHTML(p){
  var story = p.tipo === "stories" || p.tipo === "reel";
  var filas = p.laminas.map(function(l){
    var arte = l.asset
      ? '<img src="' + IMG + encodeURI(l.asset) + '" alt="">'
      : '<div class="semarte' + (story ? " story" : "") + '">' +
        (l.producao === "por_gravar" ? "vídeo<br>por gravar" : "por<br>desenhar") + '</div>';
    var copy = "";
    if (l.guiao && (l.producao === "por_gravar" || l.producao === "por_desenhar")){
      copy = '<div class="gravar">' +
             (l.producao === "por_desenhar" ? "A fotografia que entra aqui"
                                            : "O que você fala neste vídeo") + '</div>' +
             '<div class="guiao-imp">' + esc(l.guiao) + '</div>';
    }
    return '<div class="fila">' +
      '<div class="col-arte">' + arte +
        (p.laminas.length > 1 ? '<div class="rot">' + l.indice +
          (l.rotulo ? ' · ' + esc(l.rotulo) : "") + '</div>' : "") + '</div>' +
      '<div class="col-copy">' + copy + '</div></div>';
  }).join("");
  var legenda = p.legenda
    ? '<div class="leg"><div class="rot">Legenda</div><div class="texto">' +
      esc(p.legenda.texto) + '</div></div>' : "";
  return '<div class="pagina">' +
    '<div class="cab"><div class="linha1">IG · ' + esc(p.tipo) + ' · nº ' + numeroDa(p) +
      ' do dia · ' + quando(p.publicar_em) + ' · ' + hora(p.publicar_em) +
      ' · ' + esc(ROTULO[p.estado]) + '</div>' +
    '<h2>' + esc(p.titulo) + '</h2></div>' +
    filas + legenda + '</div>';
}

function impressaoHTML(){
  var pecas = pdfPeca
    ? [pecaPorChave(pdfPeca)].filter(Boolean)
    : D.pecas.slice().sort(function(a,b){ return a.publicar_em < b.publicar_em ? -1 : 1; });
  return '<div class="imp">' + pecas.map(impPecaHTML).join("") + '</div>';
}

function imprimir(chave){
  pdfPeca = chave || null;
  desenhar();
  document.body.classList.add("so-imp");
  var imgs = Array.prototype.slice.call(document.querySelectorAll(".imp img"));
  var espera = imgs.map(function(im){
    return im.complete ? Promise.resolve() : new Promise(function(res){
      im.onload = im.onerror = res; });
  });
  Promise.race([Promise.all(espera), new Promise(function(res){ setTimeout(res, 4000); })])
    .then(function(){
      window.print();
      setTimeout(function(){
        document.body.classList.remove("so-imp");
        pdfPeca = null; desenhar();
      }, 400);
    });
}

// ------------------------------------------------------------------ montar
function desenhar(){
  var raiz = document.getElementById("raiz");
  if (!D){ raiz.innerHTML = '<div class="carga">A abrir a sala…</div>'; return; }

  var meio;
  if (aberta){
    var p = pecaPorChave(aberta);
    meio = p ? pecaHTML(p) : '<div class="carga">Peça não encontrada.</div>';
  } else if (!semanaSel){
    meio = semanasHTML();
    if (D.progresso.pendentes === 0 && D.progresso.total > 0) meio = fimHTML() + meio;
  } else if (aba === "feed"){ meio = feedHTML(); }
  else if (aba === "stories"){ meio = storiesHTML(); }
  else if (aba === "reels"){ meio = reelsHTML(); }
  else { meio = estrategiaHTML(); }

  var erroHTML = erroMsg ? '<div class="aviso-erro">' + esc(erroMsg) + '</div>' : "";
  var carregando = ocupado ? '<div class="carga naoimprime" style="padding:10px">a guardar…</div>' : "";

  raiz.innerHTML = '<div class="sala">' + ladoHTML() +
    '<main class="corpo">' + erroHTML + carregando + meio + '</main></div>' +
    tabsHTML() + impressaoHTML();

  if (editando){
    var cx = document.getElementById("cx-legenda");
    if (cx){ cx.focus(); cx.addEventListener("input", function(){ rascunho = cx.value; }); }
  }
}

// ------------------------------------------------------------------ eventos
// passar de lâmina: setas, teclas ← →, ou deslizar o dedo sobre a arte
function passar(passo){
  if (!aberta) return;
  var p = pecaPorChave(aberta);
  if (!p || p.laminas.length < 2) return;
  var novo = (laminaSel || 1) + passo;
  if (novo < 1 || novo > p.laminas.length) return;
  laminaSel = novo;
  desenhar();
}

document.addEventListener("keydown", function(ev){
  if (!aberta || editando) return;
  var t = ev.target;
  if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT")) return;
  if (ev.key === "ArrowLeft"){ passar(-1); }
  else if (ev.key === "ArrowRight"){ passar(1); }
});

var toqueX = null, toqueY = null;
document.addEventListener("touchstart", function(ev){
  var alvo = ev.target.closest ? ev.target.closest(".palco") : null;
  if (!alvo || ev.touches.length !== 1){ toqueX = null; return; }
  toqueX = ev.touches[0].clientX;
  toqueY = ev.touches[0].clientY;
}, { passive: true });

document.addEventListener("touchend", function(ev){
  if (toqueX === null) return;
  var t = ev.changedTouches[0];
  var dx = t.clientX - toqueX, dy = t.clientY - toqueY;
  toqueX = null;
  // só conta como passar se for claramente horizontal (senão é rolar a página)
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.6) passar(dx < 0 ? 1 : -1);
}, { passive: true });

document.addEventListener("click", function(ev){
  var alvo = ev.target.closest ? ev.target.closest("[data-aba],[data-abrir],[data-vista],[data-filtro]," +
    "[data-lamina],[data-voltar],[data-estado],[data-comentar],[data-editar],[data-cancelar]," +
    "[data-guardar-legenda],[data-imprimir],[data-pdf],[data-semana],[data-semanas]," +
    "[data-passar]") : null;
  if (!alvo) return;
  var d = alvo.dataset;

  if (d.semana){ semanaSel = d.semana; aba = "feed"; aberta = null; diaAberto = null;
    laminaSel = null; editando = false; filtro = "todas"; window.scrollTo(0,0); desenhar(); }
  else if (d.semanas){ semanaSel = null; aberta = null; diaAberto = null; laminaSel = null;
    editando = false; filtro = "todas"; window.scrollTo(0,0); desenhar(); }
  else if (d.aba){ aba = d.aba; aberta = null; diaAberto = null; laminaSel = null; editando = false; filtro = "todas"; desenhar(); }
  else if (d.abrir){
    var p = pecaPorChave(d.abrir);
    aberta = d.abrir; laminaSel = null; editando = false;
    if (p && p.tipo === "stories") diaAberto = d.abrir;
    window.scrollTo(0,0); desenhar();
  }
  else if (d.vista){ vista = d.vista; desenhar(); }
  else if (d.filtro){ filtro = d.filtro; desenhar(); }
  else if (d.lamina){ laminaSel = Number(d.lamina); desenhar(); }
  else if (d.passar){ passar(Number(d.passar)); }
  else if (d.voltar){ aberta = null; diaAberto = null; laminaSel = null; editando = false; desenhar(); }
  else if (d.estado){ enviar(d.chave, "estado", { estado: d.estado }); }
  else if (d.comentar){
    var cx = document.getElementById("cx-com");
    var texto = cx ? cx.value.trim() : "";
    if (!texto){ if (cx) cx.focus(); return; }
    enviar(d.comentar, "comentario", { texto: texto, lamina: laminaSel });
  }
  else if (d.editar){
    var pp = pecaPorChave(aberta);
    rascunho = pp && pp.legenda ? pp.legenda.texto : "";
    editando = true; desenhar();
  }
  else if (d.cancelar){ editando = false; desenhar(); }
  else if (d.guardarLegenda){
    var cxl = document.getElementById("cx-legenda");
    var t = cxl ? cxl.value.trim() : rascunho.trim();
    if (!t) return;
    editando = false;
    enviar(d.guardarLegenda, "legenda", { texto: t });
  }
  else if (d.imprimir){ imprimir(null); }
  else if (d.pdf){ imprimir(d.pdf); }
});

puxar().then(function(){
  // ?pdf=<chave> abre direto a folha de impressão dessa peça (serve também
  // para gerar o PDF por chrome headless, sem clique)
  if (PDFQ){ pdfPeca = PDFQ; desenhar(); document.body.classList.add("so-imp"); }
}).catch(function(e){
  document.getElementById("raiz").innerHTML =
    '<div class="aviso-erro" style="margin:32px">Não consegui abrir esta sala. ' +
    'Verifique a ligação e recarregue a página.</div>';
});
})();
</script>
</body>
</html>
