<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sala de aprovação</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#211E28;--surface:#2A2632;--surface2:#332E3D;--line:#3B3546;
  --ink:#F6F1E8;--dim:#B9B2C4;--mute:#9C93AE;--brand:#6B5B95;--brandsoft:#C6B7E0;
  --ok:#7FA98A;--okink:#0F1A13;--warn:#E0B15F;--warnink:#241A07;--pend:#403A4C;--pendink:#C6BFD1;
}
html,body{background:var(--bg);color:var(--ink);
  font-family:'Instrument Sans',system-ui,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.serif{font-family:Georgia,'Times New Roman',serif}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;font-weight:600}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
img{display:block;max-width:100%}
a{color:var(--brandsoft)}
.esconde{display:none!important}

/* ---------------------------------------------------------------- estrutura */
.sala{display:flex;min-height:100vh;align-items:stretch}
.lado{width:260px;flex:none;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:22px 16px;gap:20px;position:sticky;top:0;height:100vh}
.corpo{flex:1;min-width:0;display:flex;flex-direction:column;padding-bottom:0}
.topo{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;
  padding:26px 32px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.topo h1{font-family:Georgia,serif;font-size:26px;line-height:1.15;font-weight:400}
.topo .sub{font-size:12.5px;color:var(--mute);margin-top:6px}
.tabs{display:none}

/* perfil e progresso */
.perfil{display:flex;align-items:center;gap:12px;padding:0 4px}
.perfil .quem{min-width:0}
.perfil .quem>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:44px;height:44px;border-radius:999px;flex:none;background:var(--brand);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-family:Georgia,serif}
.caixa{padding:14px;border-radius:12px;background:var(--bg);border:1px solid var(--line);
  display:flex;flex-direction:column;gap:11px}
.barra{height:5px;border-radius:999px;background:var(--surface2);overflow:hidden}
.barra i{display:block;height:100%;background:var(--brandsoft);border-radius:999px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;
  border-radius:10px;color:var(--mute);font-size:14px;font-weight:500;width:100%}
.nav button.on{background:var(--surface2);color:var(--ink);font-weight:600}

/* selos */
.selo{display:inline-flex;align-items:center;gap:6px;padding:5px 10px 5px 8px;border-radius:999px;
  font-size:11px;font-weight:600;white-space:nowrap}
.selo.aprovado{background:var(--ok);color:var(--okink)}
.selo.alteracao{background:var(--warn);color:var(--warnink)}
.selo.pendente{background:var(--pend);color:var(--pendink)}
.selo.rever{background:var(--brandsoft);color:#231F2C}
.selo.aplicada{background:var(--ok);color:var(--okink)}
.selo.pronto{background:var(--ok);color:var(--okink)}
.selinho{width:20px;height:20px;border-radius:999px;display:flex;align-items:center;justify-content:center}
.selinho.aprovado{background:var(--ok);color:var(--okink)}
.selinho.alteracao{background:var(--warn);color:var(--warnink)}
.selinho.pendente{background:var(--pend);color:var(--pendink)}
.selinho.rever{background:var(--brandsoft);color:#231F2C}
.selinho.aplicada{background:var(--ok);color:var(--okink)}

/* controlos */
.filtros{display:flex;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px;flex-wrap:wrap}
.filtros button{display:flex;align-items:center;gap:7px;min-height:36px;padding:0 13px;
  border-radius:999px;font-size:12.5px;color:var(--dim);white-space:nowrap;flex:none}
.filtros button.on{background:var(--surface2);color:var(--ink);font-weight:600}
.ponto{width:6px;height:6px;border-radius:999px}
.vistas{display:flex;gap:2px;border:1px solid var(--line);border-radius:11px;padding:2px}
.vistas button{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;
  justify-content:center;color:var(--mute)}
.vistas button.on{background:var(--surface2);color:var(--ink)}

/* grelha */
.grelha{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding:24px 32px 40px}
.cel{display:flex;flex-direction:column;gap:6px;width:100%;align-items:stretch}
.arte{display:block;position:relative;width:100%;aspect-ratio:4/5;overflow:hidden;background:var(--surface2);
  border:1px solid var(--line)}
.arte img{width:100%;height:100%;object-fit:cover}
.arte.story{aspect-ratio:9/16}
.arte .badge{position:absolute;top:6px;left:6px}
.vazia{width:100%;height:100%;display:flex!important;align-items:center;justify-content:center;text-align:center;
  padding:10px;color:var(--mute);
  background:repeating-linear-gradient(135deg,var(--surface2) 0 8px,var(--surface) 8px 16px)}
.cap{display:block;font-size:11px;color:var(--mute);line-height:1.4}
.cap b{color:var(--dim);font-weight:600}

/* lista */
.linha{display:grid;grid-template-columns:52px 104px 108px 1fr 260px 150px;gap:16px;align-items:center;
  padding:12px 32px;border-top:1px solid var(--line);width:100%}
.linha .mini{display:block;width:52px;height:65px;overflow:hidden;background:var(--surface2)}
.linha .mini img{width:100%;height:100%;object-fit:cover}
.cabl{display:grid;grid-template-columns:52px 104px 108px 1fr 260px 150px;gap:16px;
  padding:0 32px 10px;align-items:end;color:var(--mute)}

/* peca aberta */
.peca{flex:1;display:flex;align-items:stretch;min-height:0}
.centro{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
  padding:28px 32px 40px;gap:18px}
.slide{width:100%;max-width:420px;aspect-ratio:4/5;overflow:hidden;background:var(--surface2);
  box-shadow:0 20px 44px rgba(0,0,0,.38)}
.slide.story{aspect-ratio:9/16;max-width:300px}
.slide img{width:100%;height:100%;object-fit:cover}
/* passar lâmina: uma seta de cada lado, FORA da arte — nunca por cima do texto.
   No computador vivem nas margens; no telemóvel não há margem, descem para baixo. */
.palco{position:relative;width:100%;max-width:532px;display:flex;justify-content:center;
  padding:0 56px;touch-action:pan-y}
.palco.story{max-width:412px}
.seta{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;
  border-radius:999px;background:rgba(26,23,32,.72);border:1px solid rgba(246,241,232,.18);
  color:var(--ink);display:flex;align-items:center;justify-content:center;z-index:3;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:background .15s}
.seta:hover{background:rgba(26,23,32,.92)}
.seta.esq{left:0}
.seta.dir{right:0}
.seta:disabled{opacity:.28;cursor:default}
.conta-lam{font-size:11.5px;color:var(--mute);line-height:1.55;text-align:center}
.tira{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tira button{display:block;width:74px;flex:none;position:relative;line-height:0}
.tira .t{display:block;position:relative;width:74px;height:93px;overflow:hidden;
  background:var(--surface2);border:1px solid var(--line)}
.tira .t.story{height:132px}
.tira button.on .t{outline:2px solid var(--brandsoft);outline-offset:2px}
.tira img{width:100%;height:100%;object-fit:cover}
.tira .n{position:absolute;bottom:4px;left:4px;padding:1px 6px;border-radius:999px;
  background:rgba(20,18,26,.78);color:#F6F1E8;font-size:9px;font-weight:700}
.painel{width:100%;max-width:560px;padding:20px 22px;border-radius:14px;background:var(--surface);
  border:1px solid var(--line)}
.legenda{font-size:13.5px;line-height:1.75;color:var(--dim);white-space:pre-line}
.rail{width:340px;flex:none;background:var(--surface);border-left:1px solid var(--line);
  display:flex;flex-direction:column}
.rail section{padding:18px 20px;border-bottom:1px solid var(--line)}
.rail section:last-child{border-bottom:none}
.ficha div{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:5px 0}
.ficha span:first-child{color:var(--mute)}
.ficha span:last-child{color:var(--dim);text-align:right}
.decisao{display:flex;flex-direction:column;gap:9px}
.decisao button{display:flex;align-items:center;justify-content:space-between;min-height:48px;
  padding:0 16px;border-radius:10px;border:1px solid var(--line);font-size:13.5px;
  color:var(--mute);font-weight:500;width:100%}
.decisao button.aprovado.on{background:var(--ok);color:var(--okink);border-color:var(--ok);font-weight:600}
.decisao button.alteracao.on{background:var(--warn);color:var(--warnink);border-color:var(--warn);font-weight:600}
.decisao button.pendente.on{background:var(--pend);color:var(--pendink);border-color:var(--pend);font-weight:600}
.conversa{display:flex;flex-direction:column;gap:16px;flex:1}
.com{display:flex;gap:10px}
.com .a{width:30px;height:30px;border-radius:999px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:13px;font-family:Georgia,serif;background:var(--brand)}
.com.agencia .a{background:var(--surface2);color:var(--dim)}
.com .quem{font-size:11px;color:var(--mute);margin-bottom:4px}
.com .quem b{color:var(--dim);font-weight:600}
.com .t{font-size:13px;line-height:1.6;background:var(--surface2);border-radius:10px;padding:10px 12px}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);
  padding:11px 12px;min-height:88px;font:inherit;font-size:13px;line-height:1.6;resize:vertical}
textarea::placeholder{color:var(--mute)}
.bt{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;border-radius:10px;
  font-size:13px;font-weight:600;width:100%}
.bt.forte{background:var(--brandsoft);color:#231F2C}
.bt.ok{background:var(--ok);color:var(--okink)}
.bt.linha{border:1px solid var(--line);color:var(--ink)}
a.bt{text-decoration:none}
.aviso{padding:12px 14px;border-radius:10px;background:var(--surface2);font-size:11.5px;
  line-height:1.55;color:var(--dim);display:flex;gap:10px}
.nota{font-size:11.5px;color:var(--mute);line-height:1.55}

/* stories e reels */
.dias{display:flex;gap:10px;padding:18px 32px 6px;flex-wrap:wrap}
.dia{display:flex;flex-direction:column;align-items:center;gap:7px;width:86px}
.anel{display:block;width:72px;height:72px;border-radius:999px;padding:3px;
  border:2px solid var(--line);overflow:hidden}
.anel.montado{border-color:var(--brandsoft)}
.anel.aprovado{border-color:var(--ok)}
.anel img{width:100%;height:100%;object-fit:cover;border-radius:999px}
.anel .vazia{border-radius:999px}
.placas{display:flex;flex-wrap:wrap;gap:12px;padding:22px 32px 8px}
.placa{width:96px;flex:none;display:flex;flex-direction:column;gap:6px;position:relative}
.placa .p{width:96px;height:171px;overflow:hidden;position:relative;border-radius:7px;background:var(--surface2)}
.placa img{width:100%;height:100%;object-fit:cover}
.placa .num{position:absolute;top:6px;left:6px;padding:2px 7px;border-radius:999px;
  background:rgba(20,18,26,.78);color:#F6F1E8;font-size:10px;font-weight:700}
.placa .video{position:absolute;inset:0;background:rgba(33,30,40,.6);display:flex;
  align-items:center;justify-content:center;color:var(--warn)}
.cartoes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;padding:22px 32px 34px}

/* semanas (a entrada da sala) */
.semanas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;padding:24px 32px 40px;max-width:900px}
.semana{display:flex;flex-direction:column;gap:12px;padding:20px 22px;border-radius:14px;
  background:var(--surface);border:1px solid var(--line);width:100%;text-align:left;
  transition:border-color .15s}
.semana:hover{border-color:var(--brandsoft)}
.semana h3{font-family:Georgia,serif;font-size:20px;line-height:1.25;font-weight:400}
.semana .contas{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.semana .contas span{display:flex;align-items:center;gap:6px}

/* estrategia */
.est{display:flex;flex-direction:column;gap:12px;padding:22px 32px 40px;max-width:780px}
.est .bloco{padding:16px 18px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.est .andar{border-left:3px solid var(--line)}
.est .andar.on{border-left-color:var(--brandsoft)}
.est h3{font-family:Georgia,serif;font-size:19px;font-weight:400;margin:6px 0 5px}
.est .ritmo{display:flex;gap:12px;align-items:baseline;padding:4px 0}
.est .ritmo b{width:56px;flex:none;font-family:Georgia,serif;font-size:14px;
  color:var(--brandsoft);font-weight:400}
.est .regra{display:flex;gap:10px;align-items:flex-start;padding:4px 0;font-size:12.5px;
  line-height:1.5;color:var(--dim)}

/* fim */
.fim{max-width:520px;margin:0 auto;padding:32px;display:flex;flex-direction:column;
  align-items:center;text-align:center;gap:14px}
.fim .circ{width:56px;height:56px;border-radius:999px;background:var(--ok);color:var(--okink);
  display:flex;align-items:center;justify-content:center}

/* estados de carga */
.carga{padding:60px 32px;text-align:center;color:var(--mute);font-size:13px}
.aviso-erro{margin:16px 32px;padding:14px 16px;border-radius:10px;background:#3A2226;
  color:#F2D6D6;font-size:13px;line-height:1.6}

/* --------------------------------------------------------------- telemovel */
@media (max-width:899px){
  .sala{display:block;min-height:100vh;padding-bottom:78px}
  .semanas{grid-template-columns:1fr;gap:12px;padding:14px}
  .lado{width:auto;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);
    padding:16px 14px;gap:14px}
  .lado .nav{display:none}
  .lado .rodape{display:none}
  .topo{padding:16px 14px 12px;align-items:flex-start;flex-direction:column;gap:12px}
  .topo h1{font-size:20px}
  .topo .accoes{width:100%;display:flex;gap:8px;justify-content:space-between;align-items:center}
  .filtros{overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none}
  .filtros::-webkit-scrollbar{display:none}
  .topo .accoes{flex-wrap:nowrap}
  .grelha{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 14px 24px}
  .cartoes{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:14px}
  .linha,.cabl{grid-template-columns:52px 1fr 92px;gap:12px;padding-left:14px;padding-right:14px}
  .linha .col-formato,.cabl .col-formato,.linha .col-legenda,.cabl .col-legenda{display:none}
  .peca{flex-direction:column}
  .centro{padding:16px 14px 20px}
  /* sem margem lateral no telemóvel: as setas passam para baixo da arte */
  .palco{max-width:420px;padding:0;flex-wrap:wrap;gap:14px;align-items:center}
  .palco.story{max-width:300px}
  .palco>.slide{flex:0 0 100%}
  .seta{position:static;transform:none}
  .rail{width:auto;border-left:none;border-top:1px solid var(--line)}
  .dias,.placas,.est{padding-left:14px;padding-right:14px}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--surface);
    border-top:1px solid var(--line);padding:4px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
  .tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;min-height:56px;color:var(--mute);font-size:10px;font-weight:500}
  .tabs button.on{color:var(--ink);font-weight:600}
  .tabs .risco{display:block;width:20px;height:2px;border-radius:2px;background:transparent}
  .tabs button.on .risco{background:var(--brandsoft)}
}

/* ---------------------------------------------- planeamento e por dia */
.pl-fita{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.pl-cartao{flex:none;text-align:left;background:var(--surface);border:1px solid var(--line);
  border-radius:12px;padding:10px 16px;min-width:150px;cursor:pointer}
.pl-cartao.on{border-color:var(--brandsoft);background:var(--surface2)}
.pl-cartao .t{font-size:13.5px;font-weight:600;color:var(--ink)}
.pl-cartao .d{font-size:11.5px;color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
.brief{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:20px 22px;margin-bottom:18px}
.brief h2{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brief h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);
  margin:16px 0 6px;font-weight:600}
.brief p{font-size:13.5px;color:var(--dim);line-height:1.65;max-width:70ch;white-space:pre-line}
.brief ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.brief li{background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:9px 13px;font-size:13px;color:var(--dim)}
.brief li b{color:var(--ink);font-weight:600;display:block}
.brief li small{color:var(--mute);font-size:12px}
.brief li a{color:var(--brandsoft);font-weight:600;text-decoration:none}
.brief-corpo{display:grid;grid-template-columns:1.15fr .85fr;gap:0 36px}
.brief textarea{width:100%;min-height:110px;background:var(--bg);border:1px solid var(--line);
  border-radius:10px;color:var(--ink);font:inherit;font-size:13.5px;padding:10px 12px;resize:vertical}
.bt-mini{display:inline-flex;align-items:center;gap:7px;background:var(--surface2);
  border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:12.5px;
  font-weight:600;color:var(--dim);cursor:pointer;text-decoration:none}
.bt-mini:hover{border-color:var(--brandsoft);color:var(--ink)}
.bt-mini.cheio{background:var(--ok);border-color:var(--ok);color:var(--okink)}
.bt-mini.cheio:hover{color:var(--okink)}
.selo.concluido{background:var(--surface2);color:var(--dim)}
.selo.a_revisar{background:var(--pend);color:var(--pendink)}
.pl-tab{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.pl-tab table{border-collapse:collapse;width:100%;min-width:940px}
.pl-tab th,.pl-tab td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);
  vertical-align:top;font-size:12.5px}
.pl-tab th:last-child,.pl-tab td:last-child{border-right:none}
.pl-tab tr:last-child td{border-bottom:none}
.pl-tab thead th{background:var(--surface2);padding:8px 11px;text-align:left;font-weight:600;
  font-size:12px;color:var(--dim);white-space:nowrap}
.pl-tab thead th small{color:var(--mute);font-weight:500;margin-left:5px;font-variant-numeric:tabular-nums}
.pl-tab td{padding:0}
.pl-tab td>div{padding:9px 11px;min-height:54px;color:var(--dim);line-height:1.5}
.pl-tab .rotulo{background:var(--surface2);font-weight:600;color:var(--ink);
  white-space:nowrap;padding:9px 13px;font-size:12px}
.pl-tab .rotulo small{display:block;font-weight:500;color:var(--mute);white-space:normal;max-width:150px}
.pl-cel[contenteditable]{outline:none;cursor:text}
.pl-cel[contenteditable]:hover{background:var(--surface2)}
.pl-cel[contenteditable]:focus{background:var(--surface2);box-shadow:inset 0 0 0 1.5px var(--brandsoft)}
.pl-fixo{color:var(--mute)}
.pl-add{border:1.5px dashed var(--line);border-radius:12px;padding:12px;color:var(--mute);
  font-size:13px;font-weight:600;text-align:center;width:100%;margin-top:12px;cursor:pointer}
.pl-add:hover{color:var(--brandsoft);border-color:var(--brandsoft)}
.pl-nota{font-size:12px;color:var(--mute);margin-top:10px}
.dia-lista{display:flex;flex-direction:column;gap:10px;max-width:880px}
.dia-peca{display:flex;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:13px 16px;align-items:center}
.dia-peca .num{width:26px;height:26px;border-radius:999px;background:var(--surface2);
  color:var(--dim);display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:600;flex:none}
.dia-peca .mini{width:62px;aspect-ratio:4/5;flex:none;border-radius:8px;

<script>
(function(){
"use strict";
// O slug do ciclo e a chave de acesso e chega SEMPRE pelo link (?c=...).
// Nunca escrever um valor real aqui: este ficheiro vive num repo publico.
var SLUG = new URLSearchParams(location.search).get("c") || "";
var API = "https://fpsqphfgxhrwsxtrbqnk.supabase.co/functions/v1/sala/api/" + encodeURIComponent(SLUG);
var IMG = "https://fpsqphfgxhrwsxtrbqnk.supabase.co/functions/v1/sala/a/";
// Baixar passa pela rota /d/ da funcao: entrega JPG (formato de rede social) e

var ZIP = "https://fpsqphfgxhrwsxtrbqnk.supabase.co/functions/v1/sala/z/" + encodeURIComponent(SLUG) + "/";

var D = null;

var aba = "feed", vista = "grelha", filtro = "todas";

var editando = false, rascunho = "", ocupado = false, erroMsg = "";

var pdfPeca = null;                          // chave da peça no modo PDF (null = todas)

  texto:'<path d="M5 6.5V5h14v1.5M12 5v14M9 19h6"/>',

  baixar:'<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5M4.5 19.5h15"/>',

  olho:'<path d="M2.5 12S6 5.8 12 5.8s9.5 6.2 9.5 6.2-3.5 6.2-9.5 6.2S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3.1"/>',
  calend:'<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3.2V7M16 3.2V7"/>',

};
var ROTULO = { aprovado:"Aprovado", alteracao:"Com alteração", pendente:"Pendente",
               rever:"Rever de novo", aplicada:"Alteração aplicada" };
var ICONE = { aprovado:I.ok, alteracao:I.pen, pendente:I.relogio,
              rever:I.olho, aplicada:I.ok };

// O selo mostra a decisão dela e, quando a agência já mexeu, o pós-decisão:
// 'rever' = há versão nova para ela olhar; 'aplicada' = feito, nada novo.
function estadoVis(p){
  if (p && p.estado === "alteracao" && p.revisao === "rever") return "rever";
  if (p && p.estado === "alteracao" && p.revisao === "aplicada") return "aplicada";
  return p ? p.estado : p;
}

function selo(e){ return '<span class="selo ' + e + '">' + svg(ICONE[e],13,2.2) + ROTULO[e] + '</span>'; }
function selinho(e){ return '<span class="selinho ' + e + '">' + svg(ICONE[e],12,2.4) + '</span>'; }

function quando(iso, comHora){
  var d = new Date(iso);
  var o = { timeZone:"America/Sao_Paulo", day:"2-digit", month:"2-digit" };
  var s = d.toLocaleDateString("pt-BR", o);
  if (comHora){
    var h = d.toLocaleTimeString("pt-BR", { timeZone:"America/Sao_Paulo", hour:"2-digit", minute:"2-digit" });
    s += " · " + (h.replace(":00","h").replace(":","h"));
  }
  return s;
}
function hora(iso){
  var h = new Date(iso).toLocaleTimeString("pt-BR",
    { timeZone:"America/Sao_Paulo", hour:"2-digit", minute:"2-digit" });
  return h.replace(":00","h").replace(":","h");
}
function tipoRotulo(p){
  if (p.tipo === "carrossel") return "Carrossel · " + p.laminas.length;
  if (p.tipo === "stories") return "Stories · " + p.laminas.length;
  if (p.tipo === "reel") return "Reel";
  return "Post";
}
function pecaPorChave(c){
  for (var i=0;i<D.pecas.length;i++) if (D.pecas[i].chave === c) return D.pecas[i];
  return null;
}
function semanaAtual(){
  for (var i=0;i<D.semanas.length;i++) if (D.semanas[i].inicio === semanaSel) return D.semanas[i];
  return null;
}
function diaMes(iso){ var p = iso.split("-"); return p[2] + "/" + p[1]; }
function faixaSemana(s){ return diaMes(s.inicio) + " – " + diaMes(s.fim); }
function rotuloSemana(s){ return s.titulo || ("Semana de " + faixaSemana(s)); }
function daSemana(){
  if (!semanaSel) return D.pecas;
  return D.pecas.filter(function(p){ return p.semana === semanaSel; });
}
function diaSP(iso){
  return new Date(iso).toLocaleDateString("pt-BR", { timeZone:"America/Sao_Paulo" });
}
// n.º de publicação dentro do dia: a peça 1 é a primeira a sair
function numeroDa(p){
  var dia = diaSP(p.publicar_em);
  var doDia = D.pecas.filter(function(x){ return diaSP(x.publicar_em) === dia; })
    .sort(function(a,b){ return a.publicar_em < b.publicar_em ? -1 :
      a.publicar_em > b.publicar_em ? 1 : (a.chave < b.chave ? -1 : 1); });
  for (var i=0;i<doDia.length;i++) if (doDia[i].chave === p.chave) return i+1;
  return 1;
}
var MESES_C = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
function diaCurto(iso){
  var d = new Date(iso).toLocaleDateString("en-CA", { timeZone:"America/Sao_Paulo" });
  return d.slice(8,10) + MESES_C[Number(d.slice(5,7)) - 1];
}
// a rede como entra em nomes de ficheiro — os mesmos filtros do servidor,
// senão o nome mostrado difere do que o zip realmente traz
function redeDe(p){ return String(p.rede || "IG").replace(/[^\w-]/g, "") || "IG"; }
function doFeed(){ return daSemana().filter(function(p){ return p.tipo === "post" || p.tipo === "carrossel"; }); }
function dosReels(){ return daSemana().filter(function(p){ return p.tipo === "reel"; }); }
function dosStories(){ return daSemana().filter(function(p){ return p.tipo === "stories"; }); }

function arte(lam, classe){
  var c = "arte " + (classe || "");
  if (lam && lam.asset){
    return '<div class="' + c + '"><img loading="lazy" src="' + IMG + encodeURI(lam.asset) +
           '" alt=""></div>';

         txt + '</span></div></div>';
}

// ------------------------------------------------------------------- tema
// A paleta de cada cliente vive em ap_clientes.tema (a API manda-a em
// D.cliente.tema). O :root do CSS e so a reserva: se o cliente tiver tema,
// e ele que manda. Trocar de cliente = trocar as cores na base, nada aqui.
var CORES = ["bg","surface","surface2","line","ink","dim","mute","brand","brandsoft",
             "ok","okink","warn","warnink","pend","pendink"];
function aplicarTema(t){
  if (!t) return;
  var raiz = document.documentElement;
  CORES.forEach(function(k){
    var v = t[k];
    if (typeof v === "string" && /^#[0-9a-fA-F]{3,8}$/.test(v.trim()))
      raiz.style.setProperty("--" + k, v.trim());
  });
}

// ------------------------------------------------------------------- rede
function puxar(){
  return fetch(API).then(function(r){
    if (!r.ok) throw new Error("nao consegui abrir a sala");
    return r.json();
  }).then(function(j){ D = j; aplicarTema(D.cliente && D.cliente.tema); erroMsg = ""; desenhar(); });
}

// aoGravar corre SÓ depois da resposta boa: é aí que se descarta o rascunho.
// Numa falha de rede o texto fica onde estava, pronto para tentar outra vez.
function enviar(chave, accao, corpo, aoGravar){
  if (!nome){
    var n = prompt("Como se chama? (fica guardado neste telemóvel)");
    if (!n) return Promise.resolve();
    nome = n.trim().slice(0,80);
    localStorage.setItem("sala_nome_" + SLUG, nome);
  }
  corpo.autor = nome;
  corpo.autor_tipo = eu;
  ocupado = true; desenhar();
  return fetch(API + "/p/" + encodeURIComponent(chave) + "/" + accao, {
    method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(corpo)
  }).then(function(r){
    if (!r.ok) return r.json().then(function(j){ throw new Error(j.erro || "falhou"); });
    return r.json();
  }).then(function(j){ D = j; erroMsg = ""; if (aoGravar) aoGravar(); })
    .catch(function(e){ erroMsg = "Não consegui guardar: " + e.message + ". Tente outra vez."; })
    .then(function(){ ocupado = false; desenhar(); });
}

  return '<aside class="lado">' +

      '<div style="font-size:14px;font-weight:600">' + esc(c.arroba || c.nome) + '</div>' +

      '<div class="serif" style="font-size:15px;line-height:1.3">' + esc(D.ciclo.titulo) + '</div>' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--dim)">' +
        '<span><b style="color:var(--ink)">' + feitas + ' de ' + pr.total + '</b> decididas</span>' +
        '<span class="eyebrow" style="color:var(--mute)">faltam ' + pr.pendentes + '</span></div>' +
      '<div class="barra"><i style="width:' + pct + '%"></i></div>' +
      (pr.arquivadas ? '<div class="nota">A semana mais antiga já saiu do ar · ' +
        pr.arquivadas + ' peça' + (pr.arquivadas > 1 ? 's' : '') + ' arquivada' +
        (pr.arquivadas > 1 ? 's' : '') + '.</div>' : '') +

            : 'Está tudo decidido. Pode guardar o PDF quando quiser.')

function topoHTML(titulo, sub, accoes){

    '<div class="sub">' + sub + '</div></div>' +
    '<div class="accoes" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">' +
    (accoes||"") + '</div></div>';
}

function filtrosHTML(pecas){
  var c = { todas: pecas.length, pendente:0, alteracao:0, aprovado:0 };
  pecas.forEach(function(p){ c[p.estado]++; });
  var itens = [["todas","Todas",""],["pendente","Pendentes","var(--mute)"],
               ["alteracao","Com alteração","var(--warn)"],["aprovado","Aprovadas","var(--ok)"]];
  return '<div class="filtros">' + itens.map(function(f){
    return '<button data-filtro="' + f[0] + '" class="' + (filtro===f[0]?"on":"") + '">' +
      (f[2] ? '<span class="ponto" style="background:' + f[2] + '"></span>' : "") +
      '<span>' + f[1] + '</span><span style="color:var(--mute);font-weight:500">' + c[f[0]] + '</span>' +
    '</button>';
  }).join("") + '</div>';
}

function vistasHTML(){
  return '<div class="vistas">' +
    '<button data-vista="grelha" class="' + (vista==="grelha"?"on":"") + '">' + svg(I.feed,19) + '</button>' +
    '<button data-vista="lista" class="' + (vista==="lista"?"on":"") + '">' + svg(I.lista,19) + '</button>' +
  '</div>';
}

function filtrar(pecas){
  if (filtro === "todas") return pecas;
  return pecas.filter(function(p){ return p.estado === filtro; });
}

// ------------------------------------------------- a entrada: as semanas
function semanasHTML(){
  var cartoes = D.semanas.map(function(s){
    var feitas = s.total - s.pendentes;
    var pct = s.total ? Math.round(100*feitas/s.total) : 0;
    // O caminho da semana: decidir (ela) -> ajustes (agência) ->
    // rever de novo (ela, só se houver material novo) -> pronto para postar.
    var estado;
    if (s.pendentes > 0)
      estado = '<span class="selo pendente">' + svg(I.relogio,13,2.2) + s.pendentes + ' por decidir</span>';
    else if ((s.para_rever||0) > 0)
      estado = '<span class="selo rever">' + svg(I.olho,13,2.2) + s.para_rever + ' para rever</span>';
    else if ((s.por_aplicar||0) > 0)
      estado = '<span class="selo alteracao">' + svg(I.pen,13,2.2) + 'Decidido · em ajustes</span>';
    else
      estado = '<span class="selo pronto">' + svg(I.ok,13,2.2) + 'Pronto para postar</span>';
    return '<button class="semana" data-semana="' + escAttr(s.inicio) + '">' +
      '<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:10px">' +
        '<span class="eyebrow" style="color:var(--brandsoft)">' + esc(faixaSemana(s)) + '</span>' + estado +
      '</div>' +
      '<h3>' + esc(rotuloSemana(s)) + '</h3>' +
      '<div class="contas">' +
        '<span><b style="color:var(--ink)">' + s.total + '</b>&nbsp;peças</span>' +
        (s.aprovadas ? '<span><span class="ponto" style="background:var(--ok)"></span>' + s.aprovadas + ' aprovadas</span>' : "") +
        (s.com_alteracao ? '<span><span class="ponto" style="background:var(--warn)"></span>' + s.com_alteracao + ' com alteração</span>' : "") +
      '</div>' +
      '<div class="barra"><i style="width:' + pct + '%"></i></div>' +
      (s.nota ? '<div class="nota">' + esc(s.nota) + '</div>' : "") +
      '<div style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--brandsoft);font-weight:600">' +
        'Entrar na semana <span style="transform:rotate(180deg);display:inline-flex">' + svg(I.volta,15) + '</span></div>' +
    '</button>';
  }).join("");
  var corpo = D.semanas.length
    ? '<div class="semanas">' + cartoes + '</div>'
    : '<div class="carga">Ainda não há semanas no ar.</div>';
  return topoHTML("As semanas", esc(D.ciclo.titulo), "") + corpo;
}

// ------------------------------------------------------------------- feed
function feedHTML(){
  var todas = doFeed();
  var pecas = filtrar(todas);
  var corpo;
  if (!pecas.length){
    corpo = '<div class="carga">Nada nesta gaveta.</div>';
  } else if (vista === "grelha"){
    corpo = '<div class="grelha">' + pecas.map(celHTML).join("") + '</div>';
  } else {
    corpo = '<div class="cabl">' +
      ['<span></span>','<span class="eyebrow">Sai a</span>',
       '<span class="eyebrow col-formato">Formato</span>','<span class="eyebrow">Peça</span>',
       '<span class="eyebrow col-legenda">Legenda</span>','<span class="eyebrow">Estado</span>'].join("") +
      '</div>' + pecas.map(linhaHTML).join("");
  }
  var s = semanaAtual();
  return topoHTML("Feed", esc(todas.length + " posts · " + (s ? rotuloSemana(s) : D.ciclo.titulo)),
                  filtrosHTML(todas) + vistasHTML()) + corpo;
}

function linhaHTML(p){

    '<span class="col-formato" style="font-size:12.5px;color:var(--dim)">' + esc(tipoRotulo(p)) + '</span>' +

// ------------------------------------------------------------- peca aberta
function baixarHTML(p, lam){
  var dia = diaCurto(p.publicar_em);
  var prontas = p.laminas.filter(function(l){ return l.asset; });
  var temTxt = !!p.legenda || p.laminas.some(function(l){ return l.guiao; }) ||
    ((p.tipo === "reel" || p.tipo === "stories") && p.laminas.length > 0);
  if (!prontas.length && !temTxt) return "";
  var partes = [];
  if (lam && lam.asset){
    var nomeDl = redeDe(p) + "_" + p.tipo + "_" + lam.indice + "_" + dia + "_" + letraDa(p);
    partes.push('<a class="bt linha" href="' + DL + encodeURI(lam.asset) +
      '?n=' + encodeURIComponent(nomeDl) + '">' + svg(I.baixar,17) +
      (p.laminas.length > 1
        ? (p.tipo === "stories" ? 'Baixar esta placa' : 'Baixar esta lâmina')
        : 'Baixar a arte') + '</a>');
  }
  var rot = prontas.length
    ? 'Baixar o pacote · ' + prontas.length + (prontas.length > 1 ? ' artes' : ' arte') + ' + copy'
    : 'Baixar a copy e a direção (txt)';
  partes.push('<a class="bt linha" href="' + ZIP + encodeURIComponent(p.chave) + '">' +
    svg(I.baixar,17) + rot + '</a>');
  partes.push('<button class="bt linha" data-pdf="' + escAttr(p.chave) + '">' + svg(I.doc,17) +
    'Guardar o PDF desta peça</button>');
  var nota = prontas.length && prontas.length < p.laminas.length
    ? '<div class="nota" style="margin-top:9px">' + prontas.length + ' de ' + p.laminas.length +
      ' artes prontas — o pacote traz as que já existem, com a copy em txt.</div>' : "";
  return '<section class="naoimprime"><div class="eyebrow" style="color:var(--mute);margin-bottom:9px">' +
    'Baixar</div><div style="display:flex;flex-direction:column;gap:8px">' + partes.join("") + '</div>' +
    '<div class="nota" style="margin-top:9px">O pacote vem organizado: pasta do dia → ' + esc(redeDe(p)) +
    ' → formato → ' + esc(redeDe(p)) + '_' + esc(p.tipo) + '_1_' + esc(dia) + '…</div>' +
    nota + '</section>';
}

function pecaHTML(p){
  var story = p.tipo === "stories" || p.tipo === "reel";
  var idx = laminaSel || 1;
  var lam = p.laminas.filter(function(l){ return l.indice === idx; })[0] || p.laminas[0];

  var slide = '<div class="slide' + (story ? " story" : "") + '">' +
    (lam && lam.asset
      ? '<img src="' + IMG + encodeURI(lam.asset) + '" alt="">'
      : '<div class="vazia"><span class="eyebrow">' +
        (lam && lam.producao === "por_gravar" ? "vídeo por gravar" : "por desenhar") + '</span></div>') +
    '</div>';

  // carrossel e stories passam-se com as setas (ou com ← → no computador)
  if (p.laminas.length > 1){
    var setas =
      '<button class="seta esq naoimprime" data-passar="-1" aria-label="Lâmina anterior"' +
        (idx <= 1 ? ' disabled' : '') + '>' + svg(I.volta,20,2) + '</button>' +
      '<button class="seta dir naoimprime" data-passar="1" aria-label="Próxima lâmina"' +
        (idx >= p.laminas.length ? ' disabled' : '') + '>' +
        '<span style="display:flex;transform:rotate(180deg)">' + svg(I.volta,20,2) + '</span></button>';
    slide = '<div class="palco' + (story ? " story" : "") + '">' + slide + setas + '</div>';
  }

  var tira = p.laminas.length > 1 ? '<div class="tira">' + p.laminas.map(function(l){
    return '<button data-lamina="' + l.indice + '" class="' + (l.indice===idx?"on":"") + '">' +
      '<span class="t' + (story?" story":"") + '">' +
        (l.asset ? '<img loading="lazy" src="' + IMG + encodeURI(l.asset) + '" alt="">'
                 : '<span class="vazia"></span>') +
        (l.producao === "por_gravar" ? '<span class="video" style="position:absolute;inset:0;' +
          'display:flex;align-items:center;justify-content:center;background:rgba(33,30,40,.55);' +
          'color:var(--warn)">' + svg(I.camara,18) + '</span>' : "") +
      '</span><span class="n">' + l.indice + '</span></button>';
  }).join("") + '</div>' : "";

  var palavra = p.tipo === "stories" ? "placa" : "lâmina";
  var Palavra = p.tipo === "stories" ? "Placa" : "Lâmina";

  var guiao = lam && lam.guiao
    ? '<div class="painel" style="border-left:3px solid var(--warn)">' +
      '<div class="eyebrow" style="color:var(--warn);margin-bottom:8px">' +
      (lam.producao === "por_desenhar" ? "A fotografia que entra aqui"
       : p.tipo === "reel" ? "O que você fala neste vídeo"
                           : Palavra + ' ' + lam.indice + ' · o que você fala') + '</div>' +
      '<div class="serif" style="font-size:14px;line-height:1.75;white-space:pre-line">' +
      esc(lam.guiao) + '</div></div>'
    : "";

  var legenda;
  if (editando){
    legenda = '<div class="painel"><div class="eyebrow" style="color:var(--brandsoft);margin-bottom:10px">' +
      'A sua versão da legenda</div>' +
      '<textarea id="cx-legenda" style="min-height:200px">' + esc(rascunho) + '</textarea>' +
      '<div style="display:flex;gap:8px;margin-top:12px">' +
        '<button class="bt linha" data-cancelar="1">Cancelar</button>' +
        '<button class="bt forte" data-guardar-legenda="' + escAttr(p.chave) + '">Guardar legenda</button>' +
      '</div></div>';
  } else if (p.legenda){
    legenda = '<div class="painel">' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px">' +
        '<span class="eyebrow" style="color:var(--mute)">Legenda · versão ' + p.legenda.versao +
          ' · ' + esc(p.legenda.autor) + '</span>' +
        '<button class="naoimprime" data-editar="1" style="display:flex;align-items:center;gap:7px;' +
          'font-size:12px;color:var(--brandsoft);font-weight:600">' + svg(I.texto,15) + 'Reescrever</button>' +
      '</div><div class="legenda">' + esc(p.legenda.texto) + '</div></div>';
  } else {
    legenda = '<div class="painel"><div class="aviso">' + svg(I.texto,17) +
      '<div>A legenda desta peça ainda está por escrever. Assim que eu a escrever, aparece aqui.</div>' +
      '</div></div>';
  }

  var centro = '<div class="centro">' + slide + tira +
    (p.laminas.length > 1
      ? '<div class="conta-lam naoimprime">' + Palavra + ' ' + idx +
        ' de ' + p.laminas.length + ' · passe com as setas · o comentário vai só para esta</div>' : "") +
    guiao + legenda + '</div>';

  var comentarios = p.comentarios.map(function(c){
    return '<div class="com ' + (c.autor_tipo === "agencia" ? "agencia" : "") + '">' +
      '<div class="a">' + esc((c.autor||"?").charAt(0).toUpperCase()) + '</div>' +
      '<div style="flex:1;min-width:0"><div class="quem"><b>' + esc(c.autor) + '</b> · ' +
        quando(c.criado_em) + (c.lamina ? ' · ' + palavra + ' ' + c.lamina : "") + '</div>' +
        '<div class="t">' + esc(c.texto) + '</div></div></div>';
  }).join("") || '<div class="nota">Ainda sem comentários nesta peça.</div>';

  var decisao = ["aprovado","alteracao","pendente"].map(function(e){
    return '<button class="' + e + ' ' + (p.estado===e?"on":"") + '" data-estado="' + e +
           '" data-chave="' + escAttr(p.chave) + '">' + esc(ROTULO[e]) +
           (p.estado===e ? svg(I.ok,16,2.2) : "") + '</button>';
  }).join("");

  var ajuda = { aprovado:"Vai assim para o ar, no dia e hora marcados.",
                alteracao:"Publico depois de aplicar o que escreveu.",
                pendente:"Enquanto estiver pendente, não publico." }[p.estado];

  var rail = '<div class="rail naoimprime">' +
    '<section class="ficha"><div class="serif" style="font-size:19px;line-height:1.25;margin-bottom:12px">' +
      esc(p.titulo) + '</div>' +
      '<div><span>Sai a</span><span>' + quando(p.publicar_em) + ' · ' + hora(p.publicar_em) +
        (p.nota ? ' · ' + esc(p.nota) : "") + '</span></div>' +
      '<div><span>Formato</span><span>' + esc(tipoRotulo(p)) + '</span></div>' +
      '<div><span>Ordem no dia</span><span>nº ' + numeroDa(p) + ' — o 1 sai primeiro</span></div>' +
      (p.pilar ? '<div><span>Pilar</span><span>' + esc(p.pilar) + '</span></div>' : "") +
      '<div><span>Estado</span><span>' + esc(ROTULO[p.estado]) + '</span></div>' +
    '</section>' +
    '<section><div class="eyebrow" style="color:var(--mute);margin-bottom:9px">A sua decisão</div>' +
      '<div class="decisao">' + decisao + '</div>' +
      '<div class="nota" style="margin-top:9px">' + ajuda + '</div></section>' +
    '<section><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:9px">' +
      '<span class="eyebrow" style="color:var(--mute)">Comentários</span>' +
      (laminaSel ? '<span style="font-size:11px;color:var(--mute)">' + palavra + ' ' + laminaSel + '</span>' : "") +
      '</div>' +
      '<textarea id="cx-com" placeholder="' +
      (laminaSel ? "O que quer mudar na " + palavra + " " + laminaSel + "?" : "O que quer mudar nesta peça?") +
      '"></textarea>' +
      '<div style="margin-top:10px"><button class="bt forte" data-comentar="' + escAttr(p.chave) +
        '">Guardar comentário</button></div>' +
      '<div class="nota" style="margin-top:9px">Ao guardar, a peça passa a ' +
        '<b style="color:var(--warn)">Aprovado com alteração</b>.</div>' +
      '<div class="conversa" style="margin-top:16px">' + comentarios + '</div></section>' +
    baixarHTML(p, lam) +
  '</div>';

  return topoHTML(esc(p.titulo),
      esc(quando(p.publicar_em) + " · " + hora(p.publicar_em) + (p.nota ? " · " + p.nota : "")),
      '<button data-voltar="1" style="display:flex;align-items:center;gap:9px;color:var(--mute);' +
      'font-size:12.5px">' + svg(I.volta,17) + '<span>Voltar</span></button>') +
    '<div class="peca">' + centro + rail + '</div>';
}

// ---------------------------------------------------------------- stories

    var p = pecaPorChave(diaAberto);
    if (p) return pecaHTML(p);
  }

    '<div class="carga">Nada aqui ainda.</div>';

  var anel = '<div class="dias">' + dias.map(function(p){
    var capa = p.laminas.filter(function(l){ return l.asset; })[0];

    return '<button class="dia" data-abrir="' + escAttr(p.chave) + '">' +
      '<span class="anel ' + cls + '">' +

              : '<span class="vazia"></span>') + '</span>' +
      '<span style="font-size:11px;font-weight:600">' + quando(p.publicar_em) + '</span>' +
      '<span style="font-size:9.5px;color:var(--mute);text-align:center;line-height:1.3">' +
        (capa ? p.laminas.length + " placas" : "por montar") + '</span></button>';
  }).join("") + '</div>';

  var linhas = '<div style="display:flex;flex-direction:column;gap:10px;padding:14px 32px 30px">' +
    dias.map(function(p){
      var falta = p.laminas.filter(function(l){ return l.producao === "por_gravar"; }).length;
      return '<button data-abrir="' + escAttr(p.chave) + '" style="display:flex;align-items:center;gap:12px;' +
        'padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);width:100%">' +
        '<span style="flex:1;min-width:0">' +
          '<span style="display:flex;align-items:center;gap:8px;margin-bottom:5px">' +
            '<span class="serif" style="font-size:15px">' + quando(p.publicar_em) + '</span>' + selo(estadoVis(p)) + '</span>' +
          '<span style="display:block;font-size:12.5px;color:var(--dim);line-height:1.45">' + esc(p.titulo) + '</span>' +
          '<span style="display:block;font-size:11px;color:var(--mute);margin-top:4px">' +

        '<span style="color:var(--mute);transform:rotate(180deg)">' + svg(I.volta,18) + '</span></button>';

  return topoHTML("Stories", esc(montados + " dia(s) montado(s) · " + dias.length + " nesta semana"), "") +
    anel + '<div class="nota" style="padding:0 32px 6px">O dia mais recente fica à esquerda. ' +
    'Dentro do dia, a sequência lê-se pela ordem em que sai.</div>' + linhas;
}

function eVideo(p){ return p.tipo === "reel" || p.tipo === "stories"; }
function videosDaSemana(){
  return daSemana().filter(eVideo).slice()
    .sort(function(a,b){ return a.publicar_em < b.publicar_em ? -1 : 1; });

function gruposCopy(vids){
  var ordem = [], mapa = {};
  vids.forEach(function(p){
    var k = (p.rede || "IG") + " · " + (p.tipo === "reel" ? "Reels" : "Stories");
    if (!mapa[k]){ mapa[k] = []; ordem.push(k); }
    mapa[k].push(p);
  });
  return ordem.map(function(k){ return { rotulo:k, pecas:mapa[k] }; });
}
function rotuloFala(p, l){
  if (l.producao === "por_desenhar") return "a fotografia que entra aqui";
  return "o que você fala";

function cabelhoCopy(p){
  return (p.rede || "IG") + " · " + tipoRotulo(p) + " · nº " + numeroDa(p) + " do dia · " +

// A limpeza corre no afterprint (com reserva por tempo para browsers que não
// o disparam): sair por relógio enquanto a pré-visualização ainda está a ser
// montada devolvia o documento ao ecrã normal a meio do PDF.
function aposImprimir(limpar){
  var feito = false;
  function fim(){
    if (feito) return;
    feito = true;
    window.removeEventListener("afterprint", fim);
    limpar();
  }
  window.addEventListener("afterprint", fim);
  setTimeout(fim, 15000);
}

function imprimir(chave){
  pdfPeca = chave || null;
  desenhar();
  document.body.classList.add("so-imp");
  var imgs = Array.prototype.slice.call(document.querySelectorAll(".imp img"));
  var espera = imgs.map(function(im){
    return im.complete ? Promise.resolve() : new Promise(function(res){
      im.onload = im.onerror = res; });
  });
  Promise.race([Promise.all(espera), new Promise(function(res){ setTimeout(res, 4000); })])
    .then(function(){
      aposImprimir(function(){
        document.body.classList.remove("so-imp");
        pdfPeca = null; desenhar();
      });
      window.print();
    });
}

function pedirNome(){
  if (nome) return true;
  var n = prompt("Como se chama? (fica guardado neste aparelho)");
  if (!n) return false;
  nome = n.trim().slice(0,80);
  localStorage.setItem("sala_nome_" + SLUG, nome);
  return true;
}

var planoSeq = 0;                        // n\u00ba do \u00faltimo pedido do planeamento
var planoFila = Promise.resolve();       // as c\u00e9lulas gravam uma de cada vez

function enviarPlano(accao, corpo, quieto){
  if (!pedirNome()) return Promise.resolve();
  corpo.autor = nome; corpo.autor_tipo = eu;
  // quieto: nao redesenhar antes da resposta (celulas em focusout) para nao
  // destruir o elemento editado nem engolir o clique que causou o blur
  if (!quieto){ ocupado = true; desenhar(); }
  // cada resposta traz um instantaneo inteiro da sala; so a do pedido mais
  // recente pode substituir D \u2014 uma resposta atrasada trazia dados velhos
  var minha = ++planoSeq;
  return fetch(API + "/plano/" + accao, {
    method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(corpo)
  }).then(function(r){
    if (!r.ok) return r.json().then(function(j){ throw new Error(j.erro || "falhou"); });
    return r.json();
  }).then(function(j){ if (minha === planoSeq){ D = j; erroMsg = ""; } })
    .catch(function(e){ erroMsg = "N\u00e3o consegui guardar: " + e.message + ". Tente outra vez."; })
    .then(function(){
      ocupado = false;
      // em modo quieto so se redesenha se ninguem estiver a meio de outra
      // edicao (o redesenho roubava o foco e perdia texto)
      if (!quieto || !document.activeElement ||
          !document.activeElement.closest || !document.activeElement.closest("[data-cel]")) desenhar();
    });
}

                 : (r.autor_base && r.fonte ? ' \u00b7 ' + esc(r.autor_base) : "")) + '</small></li>';
      }).join("") : '<li><small>Sem refer\u00eancias ainda. Regra: s\u00f3 entram com link real ou autor de base.</small></li>') +
      '</ul></div></div></div>';
  }

  // a tabela: os slots primeiro (fixos, e daqui que nascem as pecas), depois as linhas
  var cols = '<tr><th></th>';
  for (var i=0;i<7;i++) cols += '<th>' + DIAS_C[i] + '<small>' + dataCol(w.inicio, i) + '</small></th>';
  cols += '</tr>';

  var porDia = [[],[],[],[],[],[],[]];
  (w.slots||[]).forEach(function(x){ porDia[x.dia].push(x); });
  var slotsTd = '';
  for (var d2=0; d2<7; d2++){
    slotsTd += '<td><div class="pl-fixo">' + porDia[d2].map(function(x){
      var h = String(x.hora||"").slice(0,5).replace(":", "h");
      return esc(x.rede + " " + x.formato + " " + h);
    }).join(" \u00b7 ") + '</div></td>';
  }
  var linhas = '<tr><td class="rotulo">Pe\u00e7as e hor\u00e1rios<small>rede \u00b7 formato \u00b7 hora \u2014 tudo nasce daqui</small></td>' + slotsTd + '</tr>';

  linhas += (w.linhas||[]).map(function(l){
    var tds = l.celulas.map(function(c){
      if (l.fixa) return '<td><div class="pl-fixo">' + esc(c.texto) + '</div></td>';
      return '<td><div class="pl-cel" contenteditable spellcheck="false" data-cel="' + escAttr(c.id||"") +
        '">' + esc(c.texto) + '</div></td>';
    }).join("");
    return '<tr><td class="rotulo">' + esc(l.rotulo) +
      (l.sub ? '<small>' + esc(l.sub) + '</small>' : "") + '</td>' + tds + '</tr>';
  }).join("");

  var corpo = fita + cab +
    '<div class="pl-tab"><table><thead>' + cols + '</thead><tbody>' + linhas + '</tbody></table></div>' +
    '<button class="pl-add" data-linha-nova="' + escAttr(w.inicio) + '">+ acrescentar uma linha a esta semana (cria as 7 c\u00e9lulas; escreva no dia que quiser)</button>' +
    '<div class="pl-nota">Cada c\u00e9lula guarda quem escreveu e quando. O que estiver aqui quando a semana entra em produ\u00e7\u00e3o vale como combinado para o conte\u00fado.</div>';

  return topoHTML("Planeamento", "O m\u00eas nasce aqui \u2014 briefing e tabela, semana a semana", "") + corpo;
}

// ------------------------------------------- por dia: o espelho do dia
function diaKey(iso){ return new Date(iso).toLocaleDateString("en-CA", { timeZone:"America/Sao_Paulo" }); }

// a letra da peca no dia: duas pecas do mesmo formato no mesmo dia nao
// partilham nome de ficheiro — a 1.a e "a", a 2.a "b" (regra de 29/08/2026)
function letraDa(p){
  var g = D.pecas.filter(function(x){
    return x.tipo === p.tipo && (x.rede || "IG") === (p.rede || "IG") &&
           diaKey(x.publicar_em) === diaKey(p.publicar_em);
  }).sort(function(a,b){ return a.publicar_em < b.publicar_em ? -1 :
    a.publicar_em > b.publicar_em ? 1 : (a.chave < b.chave ? -1 : 1); });
  for (var i=0;i<g.length;i++) if (g[i].chave === p.chave) return String.fromCharCode(97+i);
  return "a";
}

function diasTodos(){
  var vistos = {}, dias = [];
  D.pecas.slice().sort(function(a,b){ return a.publicar_em < b.publicar_em ? -1 : 1; })
    .forEach(function(p2){
      var k = diaKey(p2.publicar_em);
      if (!vistos[k]){
        var dow = new Date(k + "T12:00:00Z").getUTCDay();
        vistos[k] = true;
        dias.push({ k:k, rot: DIAS_C[dow] + " " + k.slice(8,10) + "/" + k.slice(5,7) });
      }
    });
  return dias;
}

function diaHTML(){
  var dias = diasTodos();
  if (!dias.length) return topoHTML("Por dia", esc(D.ciclo.titulo), "") + '<div class="carga">Nada no ar.</div>';
  var sel = null;
  if (diaSel){ for (var i=0;i<dias.length;i++) if (dias[i].k === diaSel) sel = diaSel; }
  if (!sel){
    var hoje = new Date().toLocaleDateString("en-CA", { timeZone:"America/Sao_Paulo" });
    for (var j=0;j<dias.length;j++) if (dias[j].k >= hoje){ sel = dias[j].k; break; }
    if (!sel) sel = dias[dias.length-1].k;
  }
  var fita = '<div class="pl-fita">' + dias.map(function(d3){
    return '<button class="pl-cartao' + (d3.k===sel?" on":"") + '" data-dia="' + escAttr(d3.k) + '">' +
      '<div class="t">' + esc(d3.rot) + '</div></button>';
  }).join("") + '</div>';
  var doDia = D.pecas.filter(function(p2){ return diaKey(p2.publicar_em) === sel; })
    .sort(function(a,b){ return a.publicar_em < b.publicar_em ? -1 :
      a.publicar_em > b.publicar_em ? 1 : (a.chave < b.chave ? -1 : 1); });
  var lista = '<div class="dia-lista">' + doDia.map(function(p2, i2){
    var lam = p2.laminas && p2.laminas[0];
    var mini = lam && lam.asset
      ? '<span class="mini"><img loading="lazy" src="' + IMG + encodeURI(lam.asset) + '" alt=""></span>'
      : '<span class="mini"><span>' + (lam && lam.producao === "por_gravar" ? "por<br>gravar" : "por<br>desenhar") + '</span></span>';
    var zipNome = redeDe(p2) + "_" + p2.tipo + "_" + diaCurto(p2.publicar_em) + "_" + letraDa(p2) + ".zip";
    return '<div class="dia-peca">' +
      '<span class="num">' + (i2+1) + '</span>' + mini +
      '<span class="info"><span class="l1">' + esc(hora(p2.publicar_em)) +
        '<span class="chip-rede">' + esc(p2.rede || "IG") + '</span>' +
        '<span class="chip-rede">' + esc(tipoRotulo(p2)) + '</span>' + selo(estadoVis(p2)) + '</span>' +
        '<span class="tit">' + esc(p2.titulo) + '</span>' +
        (p2.nota ? '<span class="l3">' + esc(p2.nota) + '</span>' : "") + '</span>' +
      '<span class="acoes">' +
        '<a class="bt-mini" href="' + ZIP + encodeURIComponent(p2.chave) + '">' + svg(I.baixar,14,2) + esc(zipNome) + '</a>' +
        '<button class="bt-mini" data-abrir-peca="' + escAttr(p2.chave) + '">Abrir a pe\u00e7a \u203a</button>' +
      '</span></div>';
  }).join("") + '</div>' +
  '<div class="pl-nota" style="max-width:880px;text-align:center">Espelho do dia: para comentar ou decidir, abra a pe\u00e7a.</div>';
  return topoHTML("Por dia", "Tudo o que sai, de todas as redes, pela ordem de publica\u00e7\u00e3o", "") + fita + lista;
}

function desenhar(){
  var raiz = document.getElementById("raiz");
  if (!D){ raiz.innerHTML = '<div class="carga">A abrir a sala…</div>'; return; }

  var meio;
  if (aberta){
    var p = pecaPorChave(aberta);
    meio = p ? pecaHTML(p) : '<div class="carga">Peça não encontrada.</div>';
  } else if (!semanaSel){
    if (ecra === "plano"){ meio = planoHTML(); }
    else if (ecra === "dia"){ meio = diaHTML(); }
    else {
      meio = semanasHTML();
      if (D.progresso.pendentes === 0 && D.progresso.total > 0) meio = fimHTML() + meio;
    }
  } else if (aba === "feed"){ meio = feedHTML(); }
  else if (aba === "stories"){ meio = storiesHTML(); }
  else if (aba === "reels"){ meio = reelsHTML(); }
  else if (aba === "copys"){ meio = copysHTML(); }
  else { meio = estrategiaHTML(); }

  var erroHTML = erroMsg ? '<div class="aviso-erro">' + esc(erroMsg) + '</div>' : "";
  var carregando = ocupado ? '<div class="carga naoimprime" style="padding:10px">a guardar…</div>' : "";

  raiz.innerHTML = '<div class="sala">' + ladoHTML() +
    '<main class="corpo">' + erroHTML + carregando + meio + '</main></div>' +
    tabsHTML() + impressaoHTML();

  if (editando){
    var cx = document.getElementById("cx-legenda");
    if (cx){ cx.focus(); cx.addEventListener("input", function(){ rascunho = cx.value; }); }
  }

  // a caixa de comentário renasce a cada desenho: repor o que estava escrito
  // (o rascunho só se apaga quando o servidor confirma que guardou)
  var cxc = document.getElementById("cx-com");
  if (cxc){
    if (comRascunho) cxc.value = comRascunho;
    cxc.addEventListener("input", function(){ comRascunho = cxc.value; });
  }
}

// ------------------------------------------------------------------ eventos
// passar de lâmina: setas, teclas ← →, ou deslizar o dedo sobre a arte
function passar(passo){
  if (!aberta) return;
  var p = pecaPorChave(aberta);
  if (!p || p.laminas.length < 2) return;
  var novo = (laminaSel || 1) + passo;
  if (novo < 1 || novo > p.laminas.length) return;
  laminaSel = novo;
  desenhar();
}

document.addEventListener("keydown", function(ev){
  if (!aberta || editando) return;
  var t = ev.target;
  if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT")) return;
  if (ev.key === "ArrowLeft"){ passar(-1); }
  else if (ev.key === "ArrowRight"){ passar(1); }
});

var toqueX = null, toqueY = null;
document.addEventListener("touchstart", function(ev){
  var alvo = ev.target.closest ? ev.target.closest(".palco") : null;
  if (!alvo || ev.touches.length !== 1){ toqueX = null; return; }
  toqueX = ev.touches[0].clientX;
  toqueY = ev.touches[0].clientY;
}, { passive: true });

document.addEventListener("touchend", function(ev){
  if (toqueX === null) return;
  var t = ev.changedTouches[0];
  var dx = t.clientX - toqueX, dy = t.clientY - toqueY;
  toqueX = null;
  // só conta como passar se for claramente horizontal (senão é rolar a página)
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.6) passar(dx < 0 ? 1 : -1);
}, { passive: true });

// celulas do planeamento: guarda ao sair da celula, se o texto mudou
var celOrig = {};
document.addEventListener("focusin", function(ev){
  var c = ev.target.closest ? ev.target.closest("[data-cel]") : null;
  if (c && c.dataset.cel) celOrig[c.dataset.cel] = c.textContent;
});
document.addEventListener("focusout", function(ev){
  var c = ev.target.closest ? ev.target.closest("[data-cel]") : null;
  if (!c || !c.dataset.cel) return;
  var t = c.textContent.replace(/\u00a0/g, " ").trim();
  if (t === (celOrig[c.dataset.cel] || "").trim()) return;
  var celula = c.dataset.cel;
  // uma grava\u00e7\u00e3o de cada vez: dois focusout seguidos deixavam dois POSTs em
  // corrida e o que chegasse por \u00faltimo ditava o estado, certo ou n\u00e3o
  planoFila = planoFila.then(function(){
    return enviarPlano("celula", { celula: celula, texto: t }, true);
  });
});

document.addEventListener("click", function(ev){
  var alvo = ev.target.closest ? ev.target.closest("[data-aba],[data-abrir],[data-vista],[data-filtro]," +
    "[data-lamina],[data-voltar],[data-estado],[data-comentar],[data-editar],[data-cancelar]," +
    "[data-guardar-legenda],[data-imprimir],[data-imprimir-copys],[data-pdf],[data-semana],[data-semanas]," +
    "[data-passar],[data-ecra],[data-plano-semana],[data-dia],[data-abrir-peca]," +
    "[data-brief-estado],[data-brief-editar],[data-brief-cancelar],[data-brief-guardar]," +
    "[data-linha-nova]") : null;
  if (!alvo) return;
  var d = alvo.dataset;

  if (d.semana){ semanaSel = d.semana; aba = "feed"; aberta = null; diaAberto = null;
    laminaSel = null; editando = false; filtro = "todas"; vimDoDia = false;
    window.scrollTo(0,0); desenhar(); }
  else if (d.semanas){ semanaSel = null; aberta = null; diaAberto = null; laminaSel = null;
    editando = false; filtro = "todas"; ecra = "semanas"; vimDoDia = false;
    window.scrollTo(0,0); desenhar(); }
  else if (d.ecra){ ecra = d.ecra; semanaSel = null; aberta = null; diaAberto = null;
    laminaSel = null; editando = false; briefEdit = false; window.scrollTo(0,0); desenhar(); }
  else if (d.planoSemana){ planoSel = d.planoSemana; briefEdit = false; desenhar(); }
  else if (d.dia){ diaSel = d.dia; desenhar(); }
  else if (d.abrirPeca){
    var pd = pecaPorChave(d.abrirPeca);
    if (pd){
      semanaSel = pd.semana;
      aba = pd.tipo === "stories" ? "stories" : pd.tipo === "reel" ? "reels" : "feed";
      aberta = pd.chave; editando = false; filtro = "todas"; comRascunho = "";
      laminaSel = pd.laminas.length > 1 ? 1 : null;
      if (pd.tipo === "stories") diaAberto = pd.chave;
      vimDoDia = true;                      // o Voltar devolve ao Por dia
      window.scrollTo(0,0); desenhar();
    }
  }
  else if (d.briefEstado){
    var wb = semanaPlano();
    if (wb) enviarPlano("briefing_estado", { semana: wb.inicio, estado: d.briefEstado });
  }
  else if (d.briefEditar){ briefEdit = true; desenhar(); }
  else if (d.briefCancelar){ briefEdit = false; desenhar(); }
  else if (d.briefGuardar){
    var wg = semanaPlano();
    if (!wg) return;
    var cp = document.getElementById("cx-brief-p"), cm = document.getElementById("cx-brief-m");
    briefEdit = false;
    enviarPlano("briefing", { semana: wg.inicio,
      porque: cp ? cp.value.trim() : "", marca: cm ? cm.value.trim() : "" });
  }
  else if (d.linhaNova){
    var rot = prompt("Nome da nova linha? (ex.: Observa\u00e7\u00f5es, Ideias)");
    if (rot === null) return;
    enviarPlano("linha", { semana: d.linhaNova, rotulo: (rot || "Nova linha").trim().slice(0,120) });
  }
  else if (d.aba){ aba = d.aba; aberta = null; diaAberto = null; laminaSel = null; editando = false;
    filtro = "todas"; vimDoDia = false; desenhar(); }
  else if (d.abrir){
    var p = pecaPorChave(d.abrir);
    aberta = d.abrir; editando = false; vimDoDia = false; comRascunho = "";
    // a primeira lâmina já entra selecionada: o primeiro comentário vai para
    // ela, como o texto do ecrã promete — e não para a peça inteira
    laminaSel = p && p.laminas.length > 1 ? 1 : null;
    if (p && p.tipo === "stories") diaAberto = d.abrir;
    window.scrollTo(0,0); desenhar();
  }
  else if (d.vista){ vista = d.vista; desenhar(); }
  else if (d.filtro){ filtro = d.filtro; desenhar(); }
  else if (d.lamina){ laminaSel = Number(d.lamina); desenhar(); }
  else if (d.passar){ passar(Number(d.passar)); }
  else if (d.voltar){
    aberta = null; diaAberto = null; laminaSel = null; editando = false; comRascunho = "";
    if (vimDoDia){ vimDoDia = false; semanaSel = null; ecra = "dia"; }
    desenhar();
  }
  else if (d.estado){ enviar(d.chave, "estado", { estado: d.estado }); }
  else if (d.comentar){
    var cx = document.getElementById("cx-com");
    var texto = cx ? cx.value.trim() : "";
    if (!texto){ if (cx) cx.focus(); return; }
    comRascunho = texto;
    enviar(d.comentar, "comentario", { texto: texto, lamina: laminaSel },
      function(){ comRascunho = ""; });
  }
  else if (d.editar){
    var pp = pecaPorChave(aberta);
    rascunho = pp && pp.legenda ? pp.legenda.texto : "";
    editando = true; desenhar();
  }
  else if (d.cancelar){ editando = false; desenhar(); }
  else if (d.guardarLegenda){
    var cxl = document.getElementById("cx-legenda");
    var t = cxl ? cxl.value.trim() : rascunho.trim();
    if (!t) return;
    // o editor só fecha depois da resposta boa: numa falha o texto fica lá
    enviar(d.guardarLegenda, "legenda", { texto: t },
      function(){ editando = false; rascunho = ""; });
  }
  else if (d.imprimirCopys){ imprimirCopys(); }
  else if (d.imprimir){ imprimir(null); }
  else if (d.pdf){ imprimir(d.pdf); }
});

if (!SLUG){
  document.getElementById("raiz").innerHTML =
    '<div class="aviso-erro" style="margin:32px">Este link está incompleto. ' +
    'Abra a sala pelo link que recebeu — é ele que diz qual é o seu ciclo.</div>';
} else puxar().then(function(){
  // ?pdf=<chave> abre direto a folha de impressão dessa peça (serve também
  // para gerar o PDF por chrome headless, sem clique)
  if (PDFQ){ pdfPeca = PDFQ; desenhar(); document.body.classList.add("so-imp"); }
}).catch(function(e){
  document.getElementById("raiz").innerHTML =
    '<div class="aviso-erro" style="margin:32px">Não consegui abrir esta sala. ' +
    'Verifique a ligação e recarregue a página.</div>';
});
})();
</script>
